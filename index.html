let rouletteLastResult = null;
let rouletteResultText = '';
let rouletteResultClass = '';

function rouletteGradient(){
  const segAngle = 360/ROULETTE_WHEEL_ORDER.length;
  const stops = ROULETTE_WHEEL_ORDER.map((n,i)=>{
    const c = rouletteColorOf(n);
    const color = c==='green' ? '#2e8b57' : (c==='red' ? 'var(--roulette-red)' : 'var(--roulette-black)');
    return `${color} ${i*segAngle}deg ${(i+1)*segAngle}deg`;
  }).join(', ');
  return `conic-gradient(${stops})`;
}

// Líneas divisorias finas entre casillas, para que la rueda se vea currada y no plana
function rouletteDividerGradient(){
  const segAngle = 360/ROULETTE_WHEEL_ORDER.length;
  const stops = ROULETTE_WHEEL_ORDER.map((n,i)=>{
    const start = i*segAngle;
    return `transparent ${start}deg ${start+segAngle-0.55}deg, rgba(0,0,0,0.5) ${start+segAngle-0.55}deg ${start+segAngle}deg`;
  }).join(', ');
  return `conic-gradient(${stops})`;
}

function rouletteNumbersHTML(){
  const segAngle = 360/ROULETTE_WHEEL_ORDER.length;
  const radius = 104; // distancia desde el centro, ajustada al radio de la rueda
  return ROULETTE_WHEEL_ORDER.map((n,i)=>{
    const angle = i*segAngle + segAngle/2;
    const bet = rouletteBets.find(b=>b.type==='number' && b.value===n);
    const chip = bet ? `<span class="wheel-chip" title="${bet.amount} tickets en el ${n}">${bet.amount}</span>` : '';
    return `<span class="roulette-number" style="transform: translate(-50%,-50%) rotate(${angle}deg) translateY(-${radius}px) rotate(${-angle}deg);">${n}${chip}</span>`;
  }).join('');
}

function currentBetTotal(){
  return rouletteBets.reduce((s,b)=>s+b.amount, 0);
}
function hasBet(type, value){
  return rouletteBets.some(b=>b.type===type && b.value===value);
}
function betChipHTML(type, value){
  const bet = rouletteBets.find(b=>b.type===type && b.value===value);
  if(!bet) return '';
  const valueArg = type==='number' ? value : `'${value}'`;
  return `<span class="chip-token" onclick="event.stopPropagation(); removeBet('${type}', ${valueArg})" title="Quitar esta apuesta">${bet.amount}</span>`;
}

function setChipValue(v){
  rouletteChipValue = v;
  render();
}
function placeBet(type, value){
  if(rouletteSpinning) return;
  const existing = rouletteBets.find(b=>b.type===type && b.value===value);
  if(existing){ existing.amount += rouletteChipValue; }
  else { rouletteBets.push({ id: crypto.randomUUID(), type, value, amount: rouletteChipValue }); }
  render();
}
function removeBet(type, value){
  if(rouletteSpinning) return;
  rouletteBets = rouletteBets.filter(b=>!(b.type===type && b.value===value));
  render();
}
function clearBets(){
  if(rouletteSpinning) return;
  rouletteBets = [];
  render();
}

async function spinRoulette(){
  if(rouletteSpinning) return;
  if(rouletteBets.length === 0){
    rouletteResultText = 'Coloca al menos una ficha antes de girar.';
    rouletteResultClass = 'lose';
    render();
    return;
  }
  const total = currentBetTotal();
  if((tickets[casinoPlayer]||0) < total){
    rouletteResultText = `No tienes suficientes tickets para esas apuestas (necesitas ${total}).`;
    rouletteResultClass = 'lose';
    render();
    return;
  }

  const betsAtSpinTime = rouletteBets.map(b=>({...b})); // instantánea: se juegan estas, aunque luego se vacíe rouletteBets
  rouletteSpinning = true;
  rouletteResultText = '';
  rouletteResultClass = '';
  render();
  playSound('spin');

  await addTickets(casinoPlayer, -total, 'Apuesta en la ruleta');

  const winIdx = Math.floor(Math.random()*ROULETTE_WHEEL_ORDER.length);
  const winNumber = ROULETTE_WHEEL_ORDER[winIdx];
  const winColor = rouletteColorOf(winNumber);

  const segAngle = 360/ROULETTE_WHEEL_ORDER.length;
  const center = winIdx*segAngle + segAngle/2;
  const fullSpins = 6 + Math.floor(Math.random()*3); // 6, 7 u 8 vueltas completas
  const currentMod = ((rouletteBallAngle % 360) + 360) % 360;
  const deltaToCenter = ((center - currentMod) + 360) % 360;
  const target = rouletteBallAngle + fullSpins*360 + deltaToCenter;

  const orbitEl = document.getElementById('roulette-ball-orbit');
  const wheelEl = document.getElementById('roulette-wheel');
  if(wheelEl){
    wheelEl.classList.add('spinning-disc');
  }
  if(orbitEl){
    orbitEl.classList.add('spinning');
    void orbitEl.offsetWidth; // forzar reflow para que la transición arranque desde el ángulo actual
    orbitEl.style.transform = `translateX(-50%) rotate(${target}deg)`;
  }

  setTimeout(async ()=>{
    rouletteSpinning = false;
    rouletteBallAngle = target;
    rouletteLastResult = winNumber;
    rouletteBets = []; // ya se han jugado

    let totalPayout = 0;
    const winningLines = [];
    betsAtSpinTime.forEach(b=>{
      if(b.type==='number' && b.value===winNumber){
        const pay = b.amount*35;
        totalPayout += pay;
        winningLines.push(`Nº${b.value} +${pay}`);
      } else if(b.type==='color' && b.value===winColor){
        const mult = winColor==='green' ? 14 : 2;
        const pay = b.amount*mult;
        totalPayout += pay;
        winningLines.push(`${b.value==='red'?'Rojo':b.value==='black'?'Negro':'Verde'} +${pay}`);
      }
    });

    playSound('ballDrop');
    const colorLabel = winColor==='red'?'rojo':winColor==='black'?'negro':'verde';
    if(totalPayout > 0){
      rouletteResultText = `🎉 Salió el ${winNumber} (${colorLabel}) · Aciertos: ${winningLines.join(', ')} · ¡Ganas ${totalPayout} tickets en total! ${pickLine(WIN_REACTIONS)}`;
      rouletteResultClass = 'win';
      playSound(totalPayout >= 100 ? 'bigwin' : 'win');
      fireConfetti({ count: totalPayout >= 100 ? 180 : 100 });
      await addTickets(casinoPlayer, totalPayout, 'Premio de la ruleta');
    } else {
      rouletteResultText = `Salió el ${winNumber} (${colorLabel}). Ninguna de tus apuestas ha acertado. ${pickLine(LOSE_REACTIONS)}`;
      rouletteResultClass = 'lose';
      playSound('lose');
    }
    if(wheelEl) wheelEl.classList.remove('spinning-disc');
    render();
  }, 3000);
}

function renderBlackjackTab(){

        <div class="card-hand">

        <div class="bj-action-row">

async function bjStartRound(){
  if(bjDealing) return;
  const bet = bjChipValue;
  if(!bet || bet < 1){ toast('Elige una cantidad válida.'); return; }
  if((tickets[casinoPlayer]||0) < bet){ toast('No tienes suficientes tickets.'); return; }
  bjDealing = true;
  bjBetAmount = bet;
  await addTickets(casinoPlayer, -bet, 'Apuesta en blackjack');
  bjState = { phase:'playing', playerCards:[drawCard(), drawCard()], dealerCards:[drawCard(), drawCard()], hideDealer:true, resultText:'', resultClass:'' };
  playSound('ticket');
  render();
  const pVal = bjHandValue(bjState.playerCards);
  if(pVal === 21){
    // Blackjack natural: se resuelve solo, revelando la carta tapada del crupier
    await bjResolveNatural();
  }
  bjDealing = false;
  render();
}
async function bjResolveNatural(){
  bjState.hideDealer = false;
  const dVal = bjHandValue(bjState.dealerCards);
  if(dVal === 21){
    bjState.resultText = `¡Empate! Ambos tenéis Blackjack. Recuperas tus ${bjBetAmount} tickets.`;
    bjState.resultClass = 'push';
    await addTickets(casinoPlayer, bjBetAmount, 'Empate en blackjack');
    playSound('coin');
  } else {
    const payout = Math.round(bjBetAmount * 2.5);
    bjState.resultText = `¡Blackjack natural! Ganas x2.5 → +${payout} tickets.`;
    bjState.resultClass = 'win';
    await addTickets(casinoPlayer, payout, 'Blackjack natural');
    playSound('bigwin');
  }
  bjState.phase = 'result';
}

function bjSleep(ms){ return new Promise(r=>setTimeout(r, ms)); }
async function bjPlayDealer(){
  bjState.hideDealer = false;
  render();
  await bjSleep(500);
  while(bjHandValue(bjState.dealerCards) < 17){
    bjState.dealerCards.push(drawCard());
    render();
    await bjSleep(550);
  }
  const pVal = bjHandValue(bjState.playerCards);
  const dVal = bjHandValue(bjState.dealerCards);

    bjState.resultText = `¡Ganas! ${pVal} contra ${dVal} → +${payout} tickets.`;
    bjState.resultClass = 'win';
    await addTickets(casinoPlayer, payout, 'Victoria en blackjack');
    playSound('win');
  } else if(pVal < dVal){
    bjState.resultText = `Pierdes. ${pVal} contra ${dVal}.`;
    bjState.resultClass = 'lose';
    playSound('lose');
  } else {
    bjState.resultText = `Empate a ${pVal}. Recuperas tus ${bjBetAmount} tickets.`;
    bjState.resultClass = 'push';
    await addTickets(casinoPlayer, bjBetAmount, 'Empate en blackjack');
    playSound('coin');
  }
  bjState.phase = 'result';
}

async function minesStartRound(){
  const bet = minesBetAmount||0;
  if(bet <= 0){ toast('Elige una apuesta primero.'); return; }
  if((tickets[casinoPlayer]||0) < bet){ toast('No tienes suficientes tickets.'); return; }
  await addTickets(casinoPlayer, -bet, `Apuesta en Mines (${minesCount} minas)`);
  const grid = Array(MINES_GRID_SIZE).fill(false);
  const mineIdxs = new Set();
  while(mineIdxs.size < minesCount) mineIdxs.add(Math.floor(Math.random()*MINES_GRID_SIZE));
  mineIdxs.forEach(i=>grid[i]=true);
  minesState = { phase:'playing', grid, revealed: Array(MINES_GRID_SIZE).fill(false), resultText:'', resultClass:'' };
  playSound('spin');
  render();
}

async function minesReveal(idx){
  if(minesState.phase !== 'playing') return;
  if(minesState.revealed[idx]) return;
  minesState.revealed[idx] = true;
  if(minesState.grid[idx]){
    minesState.phase = 'result';
    minesState.resultText = `💥 ¡Mina! Pierdes los ${minesBetAmount} tickets apostados.`;
    minesState.resultClass = 'lose';
    playSound('lose');
    render();
    return;
  }
  playSound('cardFlip');
  const safeRevealed = minesState.revealed.filter((r,i)=>r && !minesState.grid[i]).length;
  const totalSafe = MINES_GRID_SIZE - minesCount;
  if(safeRevealed >= totalSafe){
    await minesCashOut(); // has destapado todas las casillas seguras posibles
    return;
  }
  render();
}

async function minesCashOut(){
  if(minesState.phase !== 'playing') return;
  const safeRevealed = minesState.revealed.filter((r,i)=>r && !minesState.grid[i]).length;
  if(safeRevealed === 0){ toast('Destapa al menos una casilla antes de retirarte.'); return; }
  const mult = minesMultiplier(minesCount, safeRevealed);
  const payout = Math.round(minesBetAmount * mult);
  minesState.phase = 'result';
  minesState.resultText = `Te retiras con x${mult.toFixed(2)} → ¡ganas ${payout} tickets! ${pickLine(WIN_REACTIONS)}`;
  minesState.resultClass = 'win';
  playSound(payout >= minesBetAmount*3 ? 'bigwin' : 'win');
  if(payout >= minesBetAmount*3) fireConfetti({ count: 120 });
  await addTickets(casinoPlayer, payout, `Retirada en Mines (x${mult.toFixed(2)})`);
  render();
}

  const startTime = Date.now();
  crashInterval = setInterval(()=>{
    const elapsed = (Date.now()-startTime)/1000;
    // curva exponencial suave, tarda unos segundos en pillar velocidad
    const mult = Math.pow(Math.E, elapsed*0.18);
    crashState.multiplier = mult;
    if(mult >= crashState.crashPoint){
      clearInterval(crashInterval); crashInterval = null;
      crashState.multiplier = crashState.crashPoint;
      crashState.phase = 'crashed';
      if(crashState.cashedOutAt === null){
        crashState.resultText = `💥 ¡Explotó en x${crashState.crashPoint.toFixed(2)}! Pierdes los ${crashBetAmount} tickets.`;
        crashState.resultClass = 'lose';
        playSound('lose');
      }
      render();
      return;
    }
    crashPaint();
  }, 80);
}

// ================= PLINKO (rehecho) =================
// Geometría real: cada fila de clavos tiene un clavo MÁS que la anterior y la
// ficha choca siempre con el clavo que tiene justo debajo, rebotando media
// casilla a izquierda o derecha. Tras las 10 filas cae en una de las 11
// casillas (distribución binomial, igual que antes: mismas probabilidades y
// mismos multiplicadores). El resultado se decide ANTES de animar; la
// animación solo lo "cuenta" clavo a clavo.
const PL = { W:480, H:440, S:40, cx:240, y0:56, dy:34, bucketY:392, bucketH:34 };
let plinkoAnim = null; // mientras cae una ficha: { t0, segs, total, bet, player, bucket, paid, lastIdx }
let plinkoRaf = 0;

function setPlinkoChip(v){ if(plinkoDropping) return; plinkoChipValue = v; render(); }
function plinkoPeg(r, k){ return { x: PL.cx + (k - r/2)*PL.S, y: PL.y0 + r*PL.dy }; }

function plinkoBuildAnim(rights){
  const segs = [];
  const first = plinkoPeg(0, 0);
  segs.push({ x0: PL.cx, y0: 12, x1: first.x, y1: first.y - 11, dur: 180, hop: 0, peg: [0, 0] });
  let prev = { x: first.x, y: first.y - 11 };
  let j = 0; // nº de "derechas" acumuladas
  for(let r = 0; r < PLINKO_ROWS; r++){
    if(rights[r]) j++;
    const nx = PL.cx + (j - (r + 1)/2)*PL.S;
    if(r < PLINKO_ROWS - 1){
      const np = plinkoPeg(r + 1, j);
      segs.push({ x0: prev.x, y0: prev.y, x1: nx, y1: np.y - 11, dur: 190, hop: 9, peg: [r + 1, j] });
      prev = { x: nx, y: np.y - 11 };
    } else {
      segs.push({ x0: prev.x, y0: prev.y, x1: nx, y1: PL.bucketY - 6, dur: 210, hop: 9, peg: null });
      prev = { x: nx, y: PL.bucketY - 6 };
    }
  }
  segs.push({ x0: prev.x, y0: prev.y, x1: prev.x, y1: PL.bucketY + PL.bucketH/2, dur: 140, hop: 0, peg: null });
  return { segs, total: segs.reduce((n, s) => n + s.dur, 0) };
}
function plinkoPosAt(elapsed){
  let t = elapsed;
  for(let i = 0; i < plinkoAnim.segs.length; i++){
    const s = plinkoAnim.segs[i];
    if(t <= s.dur){
      const u = Math.max(0, t / s.dur);
      const ex = s.hop ? u*u*(3 - 2*u) : u;
      const x = s.x0 + (s.x1 - s.x0)*ex;
      const y = s.y0 + (s.y1 - s.y0)*(s.hop ? u : u*u) - s.hop*Math.sin(Math.PI*u);
      return { x, y, idx: i };
    }
    t -= s.dur;
  }
  const last = plinkoAnim.segs[plinkoAnim.segs.length - 1];
  return { x: last.x1, y: last.y1, idx: plinkoAnim.segs.length };
}
function plinkoFrame(){
  if(!plinkoAnim) return;
  const el = performance.now() - plinkoAnim.t0;
  const pos = plinkoPosAt(el);
  const chip = document.getElementById('plinko-chip');
  if(chip){ chip.setAttribute('cx', pos.x.toFixed(1)); chip.setAttribute('cy', pos.y.toFixed(1)); }
  // destello del clavo en cuanto la ficha lo toca
  while(plinkoAnim.lastIdx < pos.idx){
    const s = plinkoAnim.segs[plinkoAnim.lastIdx];
    if(s && s.peg){
      const peg = document.getElementById(`pg-${s.peg[0]}-${s.peg[1]}`);
      if(peg){ peg.classList.add('hit'); setTimeout(()=> peg.classList.remove('hit'), 150); }
    }
    plinkoAnim.lastIdx++;
  }
  if(el >= plinkoAnim.total){ plinkoFinish(); return; }
  plinkoRaf = requestAnimationFrame(plinkoFrame);
}
async function plinkoDrop(){
  if(plinkoDropping) return;
  const bet = plinkoChipValue;
  const player = casinoPlayer;
  if((tickets[player]||0) < bet){ toast('No tienes suficientes tickets.'); return; }
  plinkoDropping = true;
  plinkoLastResult = null;
  const rights = Array.from({ length: PLINKO_ROWS }, () => Math.random() < 0.5);
  const bucket = rights.filter(Boolean).length;
  // el descuento se aplica YA (en memoria) y se guarda en segundo plano; el
  // pago se espera a que ese guardado termine para no pisar el perfil.
  const paid = addTickets(player, -bet, 'Ficha en Plinko').catch(()=>{});
  playSound('spin');
  plinkoAnim = { ...plinkoBuildAnim(rights), bet, player, bucket, paid, t0: performance.now(), lastIdx: 0 };
  render();
  cancelAnimationFrame(plinkoRaf);
  plinkoRaf = requestAnimationFrame(plinkoFrame);
}
async function plinkoFinish(){
  const a = plinkoAnim;
  if(!a) return;
  plinkoAnim = null;
  cancelAnimationFrame(plinkoRaf);
  const mult = PLINKO_MULTS[a.bucket];
  const payout = Math.round(a.bet * mult);
  plinkoDropping = false;
  plinkoLastResult = { bucket: a.bucket, mult, payout };
  render();
  if(payout > 0){
    playSound(payout >= a.bet*3 ? 'bigwin' : (payout >= a.bet ? 'win' : 'lose'));
    if(payout >= a.bet*3) fireConfetti({ count: 100 });
  } else {
    playSound('lose');
  }
  await a.paid;
  if(payout > 0) await addTickets(a.player, payout, `Plinko (x${mult})`);
  render();
}

async function buyLotteryTicket(qty){
  if(loteriaDrawing) return;
  const err = document.getElementById('loteria-err');
  const cost = LOTERIA_TICKET_COST * qty;
  if((tickets[casinoPlayer]||0) < cost){
    if(err) err.textContent = `No tienes suficientes tickets (necesitas ${cost}).`;
    return;
  }
  if(err) err.textContent = '';
  playSound('ticket');
  await addTickets(casinoPlayer, -cost, `Compra de ${qty} boleto${qty===1?'':'s'} de lotería`);
  for(let i=0;i<qty;i++){
    loteria.entries.push({ id: crypto.randomUUID(), trainer: casinoPlayer, ts: Date.now() });
  }
  loteria.pot += cost;
  pushHistory(`🎫 ${NAMES[casinoPlayer]} compró ${qty} boleto${qty===1?'':'s'} de lotería`);
  render();
  const ok = await saveLoteria();
  if(!ok) queueRetry('loteria', saveLoteria);
}

async function drawLoteria(){
  if(loteriaDrawing) return;
  if(loteria.entries.length===0) return;

  // Instantánea: aunque después se vacíe loteria.entries, esta referencia y sus cálculos se conservan
  const candidates = loteria.entries;
  const counts = {};
  candidates.forEach(e=>{ counts[e.trainer] = (counts[e.trainer]||0)+1; });
  const total = candidates.length;
  const participants = TRAINERS.filter(t=>counts[t]>0);
  let cursor = 0;
  const segs = participants.map(t=>{
    const width = (counts[t]/total)*360;
    const seg = { trainer: t, start: cursor, width };
    cursor += width;
    return seg;
  });

  const winnerEntry = candidates[Math.floor(Math.random()*candidates.length)];
  const winner = winnerEntry.trainer;
  const winnerSeg = segs.find(s=>s.trainer===winner);
  // Punto aleatorio dentro de la porción del ganador, con un pequeño margen para no caer justo en el borde
  const pad = Math.min(3, winnerSeg.width/4);
  const landAngle = winnerSeg.width > pad*2
    ? winnerSeg.start + pad + Math.random()*(winnerSeg.width - pad*2)
    : winnerSeg.start + winnerSeg.width/2;

  loteriaDrawing = true;
  render();
  playSound('spin');

  const fullSpins = 6 + Math.floor(Math.random()*3); // 6, 7 u 8 vueltas completas
  const target = fullSpins*360 + (360-landAngle);

  const wheelEl = document.getElementById('loteria-wheel');
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.6s cubic-bezier(0.13, 0.82, 0.2, 1)';
    void wheelEl.offsetWidth; // forzar reflow para que la transición arranque desde el ángulo actual
    wheelEl.style.transform = `rotate(${target}deg)`;
  }

  setTimeout(async ()=>{
    const amount = loteria.pot;
    const totalEntries = total;

    loteria.history.unshift({ id: crypto.randomUUID(), winner, amount, totalEntries, ts: Date.now() });
    loteria.entries = [];
    loteria.pot = 0;
    loteriaDrawing = false;

    pushHistory(`🎉 ${NAMES[winner]} ganó la lotería: ${amount} tickets (${totalEntries} boleto${totalEntries===1?'':'s'} en juego)`);
    playSound('bigwin');
    fireConfetti({ count: 200 });
    await addTickets(winner, amount, 'Premio de la lotería');
    render();
    const ok = await saveLoteria();
    if(!ok) queueRetry('loteria', saveLoteria);
  }, 4600);
}

function spinSancionWheel(){
  if(sancionWheelSpinning || sancionState.prize) return;
  const outcomes = SANCION_WHEEL;
  sancionWheelSpinning = true;
  render();

  const idx = Math.floor(Math.random()*outcomes.length);
  const segAngle = 360/outcomes.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  sancionWheelRotation += target;
  playSound('spin');

  const wheelEl = document.getElementById('sancion-wheel');
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `rotate(${sancionWheelRotation}deg)`;
  }

  setTimeout(async ()=>{
    const outcome = outcomes[idx];
    sancionWheelSpinning = false;
    sancionState.prize = outcome.label;
    playSound('wheelLand');
    render();
    const ok = await saveSancion();
    if(!ok) queueRetry('sancion', saveSancion);
  }, 4300);
}

function toLocalInputValue(date){
  const pad = n => String(n).padStart(2,'0');
  return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}
function endOfWeek(){
  const d = new Date();
  const day = d.getDay(); // 0=domingo
  const diffToSunday = day === 0 ? 0 : 7 - day;
  const end = new Date(d.getFullYear(), d.getMonth(), d.getDate() + diffToSunday, 23, 59);
  return end;
}

        <p>No hay ningún combate programado esta semana.</p>
        <button class="primary" onclick="openScheduleDuel()">＋ Temporizador</button>
      </div>
      ${renderChallengeSection()}
      ${renderDuelTallyAndHistory()}
    `;
    return;
  }

  const scheduled = duelState.scheduled;
  app.innerHTML = `
    <div class="duel-card">
      <div class="duel-name">${scheduled.name}</div>
      <div class="duel-date">${fmtTime(new Date(scheduled.datetime).getTime())}</div>
      <div class="countdown" id="duel-countdown"></div>
      <div class="duel-top-actions">
        <button class="ghost" onclick="resetDuel()">Reiniciar</button>
      </div>
    </div>

    ${renderWheelAndBracket()}
    ${renderChallengeSection()}
    ${renderDuelTallyAndHistory()}
  `;

  updateDuelCountdown();
  duelCountdownInterval = setInterval(updateDuelCountdown, 1000);

  // Si ya se había girado antes de este render, coloca la rueda directamente en su posición final sin animar
  const wheelEl = document.getElementById('duel-wheel');
  if(wheelEl && !duelSpinning && (duelState.picks||[]).length > 0 && duelWheelRotation > 0){
    wheelEl.style.transition = 'none';
    wheelEl.style.transform = `rotate(${duelWheelRotation}deg)`;
  }
}

function updateDuelCountdown(){
  const el = document.getElementById('duel-countdown');
  if(!el || !duelState.scheduled) return;
  const target = new Date(duelState.scheduled.datetime).getTime();
  const now = Date.now();
  let diff = target - now;
  if(diff <= 0){
    el.classList.add('due');
    el.innerHTML = `<div style="font-family:'Rajdhani',sans-serif;font-size:20px;letter-spacing:1.5px;color:var(--gold);">🔔 ¡Es la hora del combate!</div>`;
    return;
  }
  el.classList.remove('due');
  const urgent = diff < 1000*60*60; // menos de 1 hora: se pone en alerta
  el.classList.toggle('urgent', urgent);
  const d = Math.floor(diff/(1000*60*60*24));
  const h = Math.floor((diff/(1000*60*60))%24);
  const m = Math.floor((diff/(1000*60))%60);
  const s = Math.floor((diff/1000)%60);
  el.innerHTML = `
    <div class="unit"><span class="num tick">${d}</span><span class="lbl">días</span></div>
    <div class="unit"><span class="num tick">${String(h).padStart(2,'0')}</span><span class="lbl">horas</span></div>
    <div class="unit"><span class="num tick">${String(m).padStart(2,'0')}</span><span class="lbl">min</span></div>
    <div class="unit"><span class="num tick">${String(s).padStart(2,'0')}</span><span class="lbl">seg</span></div>
  `;
}

function wheelGradientAndSegs(candidates){
  const colors = ['var(--lava)', 'var(--lava-hot)', 'var(--ember)'];
  const segAngle = 360 / candidates.length;
  const stops = candidates.map((t,i)=> `${colors[i%colors.length]} ${i*segAngle}deg ${(i+1)*segAngle}deg`).join(', ');
  const segs = candidates.map((t,i)=>{
    const angle = i*segAngle + segAngle/2;
    const norm = ((angle % 360) + 360) % 360;
    const flip = norm > 90 && norm < 270; // evita texto boca abajo en la mitad inferior
    return `
      <div class="wheel-seg" style="transform: rotate(${angle}deg);">
        <span style="transform: translateX(-50%) ${flip ? 'rotate(180deg)' : ''};">${NAMES[t]}</span>
      </div>
    `;
  }).join('');
  return { gradient: `conic-gradient(${stops})`, segs };
}

        </div>
      `;

function finalLoserOf(){
  // con "bye" real (torneo viejo de 3): el perdedor de la final es el que
  // no ganó, entre el ganador del Combate 1 y el que tenía el pase directo.
  // sin "bye" (combate directo nuevo, 1 vs 1): el perdedor es simplemente
  // el otro participante del propio Combate 1.
  const { match1, bye, match1Winner, finalWinner } = duelState;
  if(bye) return [match1Winner, bye].find(p=> p!==finalWinner);
  return [match1.p1, match1.p2].find(p=> p!==match1Winner);
}

  const prizeSet = role==='winner' ? duelState.finalWinnerPrize : duelState.finalLoserPrize;
  const finalLoser = finalLoserOf();
  const trainer = role==='winner' ? duelState.finalWinner : finalLoser;
  const prizes = role==='winner' ? WINNER_PRIZES : (duelState.bye ? LOSER_PRIZES : MERGED_LOSER_WHEEL);
  const spinning = role==='winner' ? finalWheelSpinningWinner : finalWheelSpinningLoser;
  const wheelId = role==='winner' ? 'final-wheel-winner' : 'final-wheel-loser';
  const title = role==='winner' ? `🏆 Ruleta del ganador · ${NAMES[trainer]}` : `Ruleta del perdedor · ${NAMES[trainer]}`;

  if(prizeSet){
    return `
      <div class="wheel-wrap">

        <div class="prize-result ${role==='winner'?'good':''}">🎁 ${prizeSet}</div>
      </div>

  const segAngle = 360/prizes.length;
  const stops = prizes.map((p,i)=> `${WHEEL_COLORS[i%WHEEL_COLORS.length]} ${i*segAngle}deg ${(i+1)*segAngle}deg`).join(', ');

    <div class="wheel-wrap">

      <button class="primary" onclick="spinFinalWheel('${role}')" ${spinning?'disabled':''}>${spinning?'Girando…':'Girar la rueda'}</button>

  const segAngle = 360/outcomes.length;

    <div class="wheel-wrap">
      <div class="spin-note">${title}</div>
      <div class="wheel-outer small">

      </div>

  `;

function spinMatch1LoserWheel(){
  if(match1LoserWheelSpinning || duelState.match1LoserPrize) return;
  const outcomes = MATCH1_LOSER_WHEEL;
  match1LoserWheelSpinning = true;
  render();

  const idx = Math.floor(Math.random()*outcomes.length);
  const segAngle = 360/outcomes.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  match1LoserWheelRotation += target;
  playSound('spin');

  const wheelEl = document.getElementById('match1-loser-wheel');
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `rotate(${match1LoserWheelRotation}deg)`;
  }

  setTimeout(async ()=>{
    const outcome = outcomes[idx];
    match1LoserWheelSpinning = false;
    duelState.match1LoserPrize = outcome.label;
    playSound('wheelLand');

    const loser = [duelState.match1.p1, duelState.match1.p2].find(p=> p!==duelState.match1Winner);
    pushHistory(`💀 ${NAMES[loser]} perdió el Combate 1 y le tocó: ${outcome.label} (aplicar manualmente si corresponde)`);

    render();
    const ok2 = await saveDuelState();
    if(!ok2) queueRetry('duel', saveDuelState);
  }, 4300);
}

function renderDuelTallyAndHistory(){
  const tally = {}; TRAINERS.forEach(t=> tally[t]=0);
  duelHistory.forEach(d=>{ if(tally[d.champion] !== undefined) tally[d.champion]++; });
  const finalBonus = (finalState && finalState.unlocked && finalState.pointsAwarded) ? finalState.pointsAwarded : {};
  TRAINERS.forEach(t=> tally[t] += (finalBonus[t]||0));
  const maxWins = Math.max(...TRAINERS.map(t=> tally[t]));

  return `
    <div class="section-sub" style="text-align:center;margin-bottom:14px;">Marcador</div>
    <div class="duel-tally">
      ${TRAINERS.map(t=>`
        <div class="t-item ${maxWins>0 && tally[t]===maxWins?'leader':''}">
          <div class="t-wins">${tally[t]}</div>
          <div class="t-name">${NAMES[t]}${finalBonus[t]?` <span class="t-bonus">(+${finalBonus[t]} FINAL)</span>`:''}</div>
        </div>
      `).join('')}
    </div>

    ${renderRivalriesCard()}

    <div class="section-sub" style="text-align:center;margin-bottom:14px;">Historial de combates</div>
    ${duelHistory.length===0 ? '<div class="empty-state">Todavía no se ha jugado ningún combate.</div>' : duelHistory.map(d=>`
      <div class="duel-history-item">
        <div class="dh-name">${d.name}</div>
        <div class="dh-date">${fmtTime(new Date(d.date).getTime())}</div>
        <div>${d.isChallenge
          ? `${NAMES[d.match1.p1]} vs ${NAMES[d.match1.p2]} → <span class="dh-champ">ganó ${NAMES[d.match1.winner]}</span> (desafío 1v1)`
          : d.final
            ? `${NAMES[d.match1.p1]} vs ${NAMES[d.match1.p2]} → ganó ${NAMES[d.match1.winner]} · Final: ${NAMES[d.final.p1]} vs ${NAMES[d.final.p2]} → <span class="dh-champ">campeón ${NAMES[d.champion]}</span>`
            : `${NAMES[d.match1.p1]} vs ${NAMES[d.match1.p2]} → <span class="dh-champ">ganó ${NAMES[d.champion]}</span>`
        }</div>
        ${d.match1WinnerReward ? `<div class="dh-reward">🎁 ${NAMES[d.match1.p1]} y ${NAMES[d.match1.p2]} +${d.match1WinnerReward} cada uno por el Combate 1</div>` : ''}
        ${d.match1LoserPrize ? `<div class="dh-reward">💀 ${NAMES[[d.match1.p1, d.match1.p2].find(p=>p!==d.match1.winner)]} → ${d.match1LoserPrize}</div>` : ''}
        ${d.finalWinnerPrize ? `<div class="dh-reward">🏆 ${NAMES[d.champion]} → ${d.finalWinnerPrize}${d.finalLoserPrize && d.finalLoser ? ` · ${NAMES[d.finalLoser]} → ${d.finalLoserPrize}` : ''}</div>` : ''}
      </div>
    `).join('')}
  `;
}

  const now = new Date();
  const minStr = toLocalInputValue(now);
  const maxStr = toLocalInputValue(endOfWeek());
  openModal(`
    <h3>Nuevo Temporizador</h3>
    <div class="field">
      <label>Nombre del combate</label>
      <input type="text" id="duel-name" placeholder="ej: Combate semana 3">
    </div>
    <div class="field">
      <label>Fecha y hora (esta semana)</label>
      <input type="datetime-local" id="duel-datetime" min="${minStr}" max="${maxStr}">
    </div>
    <div class="err-msg" id="duel-err"></div>
    <div class="modal-actions">
      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="submitScheduleDuel()">Programar</button>
    </div>
  `);
}
async function submitScheduleDuel(){
  const name = document.getElementById('duel-name').value.trim();
  const dt = document.getElementById('duel-datetime').value;
  const err = document.getElementById('duel-err');
  if(!name || !dt){ err.textContent = 'Rellena el nombre y la fecha.'; return; }
  // Torneo de 3: sortea quién juega el Combate 1 (dos jugadores); el tercero pasa
  // directo a la final ("bye"). El sorteo se hace en la propia pantalla (spinWheel).
  duelState = { scheduled: { name, datetime: dt }, picks:[], bye:null, match1:null, match1Games:[], match1Winner:null, match1LoserPrize:null, finalGames:[], finalWinner:null, finalWinnerPrize:null, finalLoserPrize:null };
  duelWheelRotation = 0;
  finalWheelRotationWinner = 0;
  finalWheelRotationLoser = 0;
  finalWheelSpinningWinner = false;
  finalWheelSpinningLoser = false;
  match1LoserWheelRotation = 0;
  match1LoserWheelSpinning = false;
  closeModal();
  render();
  const ok = await saveDuelState();
  if(!ok) queueRetry('duel', saveDuelState);
}

function resetDuel(){
  if(!confirm('¿Reiniciar el temporizador y el combate actual? (no borra el historial de combates ya jugados)')) return;
  duelState = { scheduled:null, picks:[], bye:null, match1:null, match1Games:[], match1Winner:null, match1LoserPrize:null, finalGames:[], finalWinner:null, finalWinnerPrize:null, finalLoserPrize:null };
  duelWheelRotation = 0;
  finalWheelRotationWinner = 0;
  finalWheelRotationLoser = 0;
  finalWheelSpinningWinner = false;
  finalWheelSpinningLoser = false;
  match1LoserWheelRotation = 0;
  match1LoserWheelSpinning = false;
  render();
  saveDuelState().then(ok=>{ if(!ok) queueRetry('duel', saveDuelState); });
}

function spinWheel(){
  if(duelSpinning) return;
  const candidates = TRAINERS.filter(t=> !(duelState.picks||[]).includes(t));
  if(candidates.length < 2) return; // ya está decidido
  duelSpinning = true;
  render();
  const idx = Math.floor(Math.random()*candidates.length);
  const segAngle = 360/candidates.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  duelWheelRotation += target;
  const wheelEl = document.getElementById('duel-wheel');
  wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
  // forzar reflow para que la transición se aplique
  void wheelEl.offsetWidth;
  wheelEl.style.transform = `rotate(${duelWheelRotation}deg)`;
  playSound('spin');

  setTimeout(async ()=>{
    duelSpinning = false;
    playSound('wheelLand');
    const picked = candidates[idx];
    duelState.picks = [...(duelState.picks||[]), picked];
    duelWheelRotation = 0; // la siguiente rueda tiene otro número de candidatos, debe arrancar limpia
    if(duelState.picks.length === 2){
      const bye = TRAINERS.find(t=> !duelState.picks.includes(t));
      duelState.bye = bye;
      duelState.match1 = { p1: duelState.picks[0], p2: duelState.picks[1] };
      duelState.match1Winner = null;
      duelState.match1LoserPrize = null;
      duelState.finalWinner = null;
      duelState.finalWinnerPrize = null;
      duelState.finalLoserPrize = null;
    }
    render();
    const ok = await saveDuelState();
    if(!ok) queueRetry('duel', saveDuelState);
  }, 4300);
}

// Resultados de la partida anterior (SoulSilver), para usar como precedente
// cuando dos entrenadores no se han enfrentado nunca en esta partida (USUM).
// Se rellena a mano -- clave "trainerA-trainerB" en orden alfabetico, con
// las victorias de cada uno.

// ---- Narracion de cada juego del BO3: varias variantes por categoria, sin
// repetir la misma hasta que se hayan usado todas (se reinicia cada semana). ----
function pickNarrationVariant(category, variants){
  duelState.usedNarrations = duelState.usedNarrations || {};
  let used = duelState.usedNarrations[category] || [];
  let available = variants.map((_,i)=>i).filter(i=>!used.includes(i));
  if(available.length === 0){ used = []; available = variants.map((_,i)=>i); }
  const idx = available[Math.floor(Math.random()*available.length)];
  duelState.usedNarrations[category] = [...used, idx];
  return variants[idx];
}

// Elige un Pokémon vivo al azar del equipo de un entrenador, para meterlo en
// las narraciones. Devuelve {nickname, species} o null si no tiene equipo.
function pickTeamMon(trainer){
  const alive = allMonsOf(trainer).filter(m=>m.inTeam && !m.fainted);
  if(alive.length === 0) return null;
  const mon = alive[Math.floor(Math.random()*alive.length)];
  const species = mon.speciesName.replace(/-/g,' ').replace(/\b\w/g, c=>c.toUpperCase());
  return { nickname: mon.nickname, species };
}

/* ==================== SISTEMA ELO (combates + lockes) ====================
   Un único Elo por persona que mezcla las dos cosas que importan: los COMBATES
   ganados (partidas al mejor de 3 de la Arena) y los LOCKES ganados (ganar una
   partida entera del Triolocke pesa bastante más que un combate).
   - Todos empiezan en 1000.
   - Combate: Elo clásico (K=24). Si se conoce el marcador, un 2-0 mueve un 20 %
     más que un 2-1.
   - Locke ganado: cuenta como una victoria "gorda" (K=32) contra CADA rival de
     esa partida.
   El historial se recalcula entero cada vez (duelHistory de esta partida +
   LEGACY_COMBATS y LOCKE_RESULTS de las partidas anteriores), no hay nada que
   guardar en el backend. ============================================================== */
// K-factors subidos respecto al original (24/32): con tan pocas partidas
// jugadas, un Elo "de ajedrez" apenas se mueve — así cada combate y cada
// locke pesan de verdad y los tiers (950-1350) se recorren en pocas partidas.
const ELO_START = 1000, ELO_K_COMBAT = 40, ELO_K_LOCKE = 80, ELO_MARGIN_20 = 1.3;

// SoulSilver: no tenemos el registro real, se sigue repartiendo a partir del
// marcador total que ya había en la web.
function eloBuildLegacyFromTotals(){
  const sources = [
    ['Pokémon SoulSilver', SOULSILVER_HISTORY],
  ];
  const out = [];
  sources.forEach(([game, table]) => {
    const perPair = Object.entries(table).map(([key, rec]) => {
      const [a, b] = key.split('-');
      const na = rec[a] || 0, nb = rec[b] || 0, n = na + nb;
      const seq = Array(n).fill(a);
      for(let k = 0; k < nb; k++) seq[Math.min(n - 1, Math.floor((k + 0.5) * n / nb))] = b;
      return seq.map(w => ({ game, winner: w, loser: w === a ? b : a }));
    });
    let i = 0, more = true;
    while(more){ // reparto entre parejas por turnos
      more = false;
      perPair.forEach(seq => { if(i < seq.length){ out.push(seq[i]); more = true; } });
      i++;
    }
  });
  return out;
}
const LEGACY_COMBATS = [...eloBuildLegacyFromTotals(), ...LEGACY_COMBATS_REAL];

const ELO_TIERS = [
  { min: 0,    name: 'Novato',            icon: '🌱', color: '#9ed8a8' },
  { min: 950,  name: 'Entrenador',        icon: '🎒', color: '#7fc4ff' },

  { min: 1350, name: 'Campeón',           icon: '👑', color: '#f5d76e' },
];
function eloTier(r){ let t = ELO_TIERS[0]; ELO_TIERS.forEach(x => { if(r >= x.min) t = x; }); return t; }
function eloExpected(ra, rb){ return 1 / (1 + Math.pow(10, (rb - ra) / 400)); }
function eloScoreOf(games, a, b){
  const s = {}; s[a] = 0; s[b] = 0;
  (games || []).forEach(w => { if(w in s) s[w]++; });
  return s;
}

let _eloCache = null, _eloKey = '';
function computeElo(){
  const hist = duelHistory || [];
  const key = hist.length + ':' + (hist[0] ? hist[0].id : '') + ':' + (hist[hist.length - 1] ? hist[hist.length - 1].id : '');
  if(_eloCache && _eloKey === key) return _eloCache;

  const R = {}, series = {}, st = {};
  TRAINERS.forEach(t => {
    R[t] = ELO_START;
    series[t] = [{ elo: ELO_START, label: 'Inicio', type: 'start' }];
    st[t] = { w: 0, l: 0, streak: 0, best: 0, streakVs: {}, peak: ELO_START, lockes: 0, fromCombats: 0, fromLockes: 0, curW: 0, curL: 0 };
  });
  const h2h = {}; // 'a-b' (ordenado) -> { a: n, b: n }

  const applyCombat = (game, w, l, m, tag) => {
    if(!(w in R) || !(l in R)) return;
    const e = eloExpected(R[w], R[l]);
    const d = ELO_K_COMBAT * (m || 1) * (1 - e);
    R[w] += d; R[l] -= d;
    st[w].fromCombats += d; st[l].fromCombats -= d;
    st[w].w++; st[l].l++;
    st[w].streak = st[w].streak > 0 ? st[w].streak + 1 : 1;
    st[l].streak = st[l].streak < 0 ? st[l].streak - 1 : -1;
    // "mejor racha" = seguidas contra EL MISMO rival (no vale encadenar victorias
    // contra gente distinta, ni entre partidas distintas, como pasaba antes).
    st[w].streakVs[l] = (st[w].streakVs[l] || 0) + 1;
    st[l].streakVs[w] = 0;
    st[w].best = Math.max(st[w].best, st[w].streakVs[l]);
    if(tag === 'run'){ st[w].curW++; st[l].curL++; }
    const k = [w, l].sort().join('-');
    (h2h[k] = h2h[k] || {})[w] = ((h2h[k] || {})[w] || 0) + 1;
    [w, l].forEach(t => { st[t].peak = Math.max(st[t].peak, R[t]); });
    series[w].push({ elo: R[w], label: `${game}: gana a ${NAMES[l]}`, type: 'combat', d });
    series[l].push({ elo: R[l], label: `${game}: pierde con ${NAMES[w]}`, type: 'combat', d: -d });
  };
  const applyLocke = (game, players, winner) => {
    if(!winner || !(winner in R)) return;
    players.filter(p => p !== winner && p in R).forEach(o => {
      const e = eloExpected(R[winner], R[o]);
      const d = ELO_K_LOCKE * (1 - e);
      R[winner] += d; R[o] -= d;
      st[winner].fromLockes += d; st[o].fromLockes -= d;
    });
    st[winner].lockes++;
    players.filter(p => p in R).forEach(t => {
      st[t].peak = Math.max(st[t].peak, R[t]);
      series[t].push({ elo: R[t], label: `${game}: locke ${t === winner ? 'GANADO' : 'perdido'}`, type: 'locke' });
    });
  };

  ELO_LEGACY_GAMES.forEach(game => {
    LEGACY_COMBATS.filter(c => c.game === game).forEach(c => {
      let m = 1;
      if(c.score){ const p = c.score.split('-').map(Number); if(p[0] === 2 && p[1] === 0) m = ELO_MARGIN_20; }
      applyCombat(game, c.winner, c.loser, m);
    });
    const lk = LOCKE_RESULTS.find(x => x.game === game);
    if(lk) applyLocke(game, lk.players, lk.winner);
  });

  // Rubí Omega: duelHistory guarda el más reciente primero → del más antiguo al más nuevo
  [...hist].reverse().forEach(h => {
    const one = (c, score) => {
      if(!c || !c.winner) return;
      const l = c.winner === c.p1 ? c.p2 : c.p1;
      let m = 1;
      if(score && score[c.winner] === 2 && score[l] === 0) m = ELO_MARGIN_20;
      applyCombat('Rubí Omega', c.winner, l, m, 'run');
    };
    one(h.match1, h.match1Score);
    one(h.final, h.finalScore);
  });

  _eloCache = { R, series, st, h2h };
  _eloKey = key;
  return _eloCache;
}
function eloOf(t){ return Math.round(computeElo().R[t] || ELO_START); }
function eloWinProb(a, b){ const E = computeElo().R; return eloExpected(E[a] || ELO_START, E[b] || ELO_START); }

function eloSparkline(t){
  const s = computeElo().series[t];
  const W = 320, H = 92, P = 8;
  const vals = s.map(p => p.elo);
  const lo = Math.min(...vals, ELO_START) - 12, hi = Math.max(...vals, ELO_START) + 12;
  const x = i => P + (s.length === 1 ? 0 : i * (W - 2 * P) / (s.length - 1));
  const y = v => H - P - (v - lo) * (H - 2 * P) / (hi - lo || 1);
  const pts = s.map((p, i) => `${x(i).toFixed(1)},${y(p.elo).toFixed(1)}`).join(' ');
  const base = y(ELO_START).toFixed(1);
  const dots = s.map((p, i) => p.type === 'locke'
      ? `<circle cx="${x(i).toFixed(1)}" cy="${y(p.elo).toFixed(1)}" r="4.2" class="elo-dot locke"><title>${p.label}</title></circle>` : '').join('');
  const last = s[s.length - 1];
  return `<svg class="elo-spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
      <line x1="${P}" x2="${W - P}" y1="${base}" y2="${base}" class="elo-base"/>
      <polyline points="${pts}" class="elo-line"/>${dots}
      <circle cx="${x(s.length - 1).toFixed(1)}" cy="${y(last.elo).toFixed(1)}" r="4" class="elo-dot now"/>
    </svg>`;
}

function renderEloCard(t){
  const E = computeElo();
  const r = Math.round(E.R[t]), st = E.st[t], tier = eloTier(r);
  const games = st.w + st.l;
  const pct = games ? Math.round(100 * st.w / games) : 0;
  const rivals = TRAINERS.filter(o => o !== t);
  const h2hRows = rivals.map(o => {
    const k = [t, o].sort().join('-'); const rec = E.h2h[k] || {};
    const p = Math.round(100 * eloExpected(E.R[t], E.R[o]));
    return `<div class="elo-h2h"><span class="n">vs ${NAMES[o]}</span><span class="rec">${rec[t] || 0} - ${rec[o] || 0}</span><span class="pr">${p}% de ganar</span></div>`;
  }).join('');
  const nextTier = ELO_TIERS.find(x => x.min > r);
  const streakTxt = st.streak > 0 ? `🔥 ${st.streak}` : st.streak < 0 ? `🧊 ${-st.streak}` : '—';
  const sign = v => (v >= 0 ? '+' : '') + Math.round(v);
  return `
    <div class="kpi wide brk elo-card">
      <div class="kpi-label">⚡ Elo · combates + lockes</div>
      <div class="elo-top">
        <div class="elo-rating" style="--tier:${tier.color}">
          <div class="elo-num">${r}</div>
          <div class="elo-tier">${tier.icon} ${tier.name}</div>
          ${nextTier ? `<div class="elo-next">${nextTier.min - r} para ${nextTier.name}</div>` : `<div class="elo-next">Rango máximo</div>`}
        </div>
        <div class="elo-chart">${eloSparkline(t)}<div class="elo-chart-legend"><i class="lk"></i> locke ganado/perdido &nbsp; · &nbsp; ${computeElo().series[t].length - 1} eventos</div></div>
      </div>
      <div class="elo-stats">
        <div class="elo-stat"><b>${st.w} - ${st.l}</b><span>combates (${pct}%)</span></div>
        <div class="elo-stat"><b>${st.lockes}</b><span>lockes ganados</span></div>
        <div class="elo-stat"><b>${Math.round(st.peak)}</b><span>Elo máximo</span></div>
        <div class="elo-stat"><b>${streakTxt}</b><span>racha (mejor: ${st.best})</span></div>
        <div class="elo-stat"><b>${sign(st.fromCombats)} / ${sign(st.fromLockes)}</b><span>de combates / de lockes</span></div>
      </div>
      <div class="elo-h2h-wrap">${h2hRows}</div>
      ${ELO_LEGACY_PROVISIONAL ? `<div class="elo-note">Ultra Sol y Pokémon X ya usan el historial real combate a combate. Solo SoulSilver sigue siendo provisional (repartido a partir del marcador total) hasta tener el registro real.</div>` : ''}
    </div>`;
}

function bo3Narration(games, p1, p2, isFinal){
  let text = bo3NarrationCore(games, p1, p2, isFinal);
  const pair = [p1, p2].sort().join('-');
  if(pair === 'alex-iker' && Math.random() < 0.55){
    text += ' ' + pickNarrationVariant('us_callback', ULTRASOL_CALLBACKS.map(s => () => s))();

    text += ' ' + pickNarrationVariant('joel_jab', JOEL_JABS.map(s => () => s))();
  }
  return text;

async function recordBo3Game(matchKey, gameWinner){
  const isFinal = matchKey === 'final';
  const p1 = isFinal ? duelState.match1Winner : duelState.match1.p1;
  const p2 = isFinal ? duelState.bye : duelState.match1.p2;
  const gamesKey = isFinal ? 'finalGames' : 'match1Games';

  duelState[gamesKey] = [...(duelState[gamesKey]||[]), gameWinner];
  const games = duelState[gamesKey];
  const wins = { [p1]: 0, [p2]: 0 };
  games.forEach(g => wins[g]++);
  const matchDecided = wins[p1] === 2 || wins[p2] === 2;
  const matchWinner = wins[p1] === 2 ? p1 : (wins[p2] === 2 ? p2 : null);

  // La narracion se calcula UNA sola vez aqui (elige variante al azar) y se
  // guarda como texto fijo -- si se recalculara en cada render() cambiaria
  // sola cada pocos segundos y no daria tiempo a leerla.
  duelState[isFinal ? 'finalNarration' : 'match1Narration'] = bo3Narration(games, p1, p2, isFinal);

  playSound(matchDecided ? (isFinal ? 'bigwin' : 'win') : 'reelStop');
  if(matchDecided) fireConfetti({ count: isFinal ? 220 : 70 });
  render();

  if(matchDecided){
    if(isFinal) duelState.finalWinner = matchWinner;
    else {
      duelState.match1Winner = matchWinner;
      // Combate directo (sin "bye" real, ver más abajo en submitScheduleDuel):
      // no hay una segunda ronda que jugar, el ganador del único combate ya
      // es el ganador final -- se pasa directo a las ruletas de recompensa.
      if(!duelState.bye) duelState.finalWinner = matchWinner;
    }
  }
  const ok = await saveDuelState();
  if(!ok) queueRetry('duel', saveDuelState);

  if(matchDecided){
    if(isFinal){
      await addTickets(p1, 10, 'Jugar la Final');
      await addTickets(p2, 10, 'Jugar la Final');
    } else {
      await addTickets(p1, 10, 'Jugar el Combate 1');
      await addTickets(p2, 10, 'Jugar el Combate 1');
    }
    await resolveDuelBets(matchKey, matchWinner);
  }
  render();
}

function openChallenge(targetTrainer){

  }
  const challengers = TRAINERS.filter(t=>t!==targetTrainer);

      </select>
    </div>
    <div class="field">

    <div class="err-msg" id="challenge-err"></div>

      <button class="ghost" onclick="closeModal()">Cancelar</button>
      <button class="primary" onclick="confirmChallenge('${targetTrainer}')">Desafiar</button>

function renderChallengeMonPicker(targetTrainer){
  const stakeId = document.getElementById('challenge-stake-select').value;
  const stake = CHALLENGE_STAKES.find(s=>s.id===stakeId);
  const el = document.getElementById('challenge-mon-picker');
  if(!stake.needsMonPick){ el.innerHTML = ''; return; }
  const pool = allMonsOf(targetTrainer);
  if(pool.length === 0){ el.innerHTML = `<div class="table-hint">${NAMES[targetTrainer]} no tiene ningún Pokémon.</div>`; return; }
  el.innerHTML = `
    <div class="field">
      <label>¿Cuál de sus Pokémon?</label>
      <select id="challenge-mon-select">
        ${pool.map(m=>`<option value="${m.pid}">${m.nickname} (${m.speciesName.replace(/-/g,' ')}) ${m.inTeam?'· equipo':'· caja'}</option>`).join('')}
      </select>
    </div>
  `;
}

  const challenger = document.getElementById('challenge-who-select').value;
  const stakeId = document.getElementById('challenge-stake-select').value;
  const stake = CHALLENGE_STAKES.find(s=>s.id===stakeId);

    if(!monSel){ err.textContent = `${NAMES[targetTrainer]} no tiene ningún Pokémon para apostar.`; return; }
    stakeMonPid = monSel.value;
    const mon = allMonsOf(targetTrainer).find(m=>m.pid===stakeMonPid);
    stakeMonLabel = mon ? `${mon.nickname} (${mon.speciesName.replace(/-/g,' ')})` : null;
  }
  await addTickets(challenger, -CHALLENGE_COST, `Desafío contra ${NAMES[targetTrainer]}`);
  challengeState = {
    challenger, opponent: targetTrainer, stakeId, stakeMonPid, stakeMonLabel,
    games: [], narration: null,
  };
  pushHistory(`⚔️ ${NAMES[challenger]} ha desafiado a ${NAMES[targetTrainer]} — en juego: ${stake.label}${stakeMonLabel ? ` (${stakeMonLabel})` : ''}`);
  closeModal();
  render();
  const ok = await saveChallengeState();
  if(!ok) queueRetry('challenge', saveChallengeState);
}

function renderChallengeSection(){
  if(!challengeState) return '';
  const { challenger, opponent, games, stakeId, stakeMonLabel } = challengeState;
  const stake = CHALLENGE_STAKES.find(s=>s.id===stakeId);
  const wins = { [challenger]:0, [opponent]:0 };
  (games||[]).forEach(g=>wins[g]++);
  const decided = wins[challenger]===2 || wins[opponent]===2;
  const winner = wins[challenger]===2 ? challenger : (wins[opponent]===2 ? opponent : null);
  return `
    <div class="section-label" style="margin-top:24px;">⚔️ Desafío en marcha</div>
    <div class="bracket-match ${decided?'':'active'}">
      <div class="match-label">${stake.label}${stakeMonLabel ? ` — ${stakeMonLabel}` : ''} ${games.length>0 && !decided ? `· Juego ${Math.min(games.length+1,3)} de 3` : ''}</div>
      <div class="bracket-vs">
        <div class="bracket-player ${winner===challenger?'winner':''} ${decided?'locked':''}" ${decided?'':`onclick="recordChallengeGame('${challenger}')"`}>${NAMES[challenger]}</div>
        <div class="bracket-vs-sep">VS</div>
        <div class="bracket-player ${winner===opponent?'winner':''} ${decided?'locked':''}" ${decided?'':`onclick="recordChallengeGame('${opponent}')"`}>${NAMES[opponent]}</div>
      </div>
      ${games.length>0 ? `<div class="bo3-score">${NAMES[challenger]} ${wins[challenger]} - ${wins[opponent]} ${NAMES[opponent]}</div>` : ''}

    ${decided ? `<div class="modal-actions" style="justify-content:center;"><button class="primary" onclick="closeChallenge()">Cerrar desafío</button></div>` : `<div class="modal-actions" style="justify-content:center;"><button class="ghost" onclick="cancelChallenge()">✖️ Cancelar desafío</button></div>`}

}
async function cancelChallenge(){
  if(!challengeState) return;
  const { challenger, opponent } = challengeState;
  await addTickets(challenger, CHALLENGE_COST, `Desafío contra ${NAMES[opponent]} cancelado (devolución)`);
  challengeState = null;
  render();
  const ok = await saveChallengeState();
  if(!ok) queueRetry('challenge', saveChallengeState);
}

async function recordChallengeGame(gameWinner){
  if(!challengeState) return;
  const { challenger, opponent } = challengeState;
  challengeState.games = [...(challengeState.games||[]), gameWinner];
  const games = challengeState.games;
  const wins = { [challenger]:0, [opponent]:0 };
  games.forEach(g=>wins[g]++);
  const decided = wins[challenger]===2 || wins[opponent]===2;
  const winner = wins[challenger]===2 ? challenger : (wins[opponent]===2 ? opponent : null);

  challengeState.narration = bo3Narration(games, challenger, opponent, false);

  playSound(decided ? 'win' : 'reelStop');
  if(decided) fireConfetti({ count: 90 });
  render();

  if(decided){
    const loser = winner===challenger ? opponent : challenger;
    duelHistory.unshift({
      id: crypto.randomUUID(),
      name: `Desafío: ${NAMES[challenger]} vs ${NAMES[opponent]}`,
      date: new Date().toISOString(),
      match1: { p1: challenger, p2: opponent, winner },
      final: null,
      champion: winner,
      isChallenge: true,
    });
    await saveDuelHistory();
    await resolveChallengeReward(winner, loser);
  }
  const ok = await saveChallengeState();
  if(!ok) queueRetry('challenge', saveChallengeState);
}

async function resolveChallengeReward(winner, loser){
  const { stakeId, stakeMonLabel } = challengeState;
  const src = `Desafío ganado a ${NAMES[loser]}`;
  if(stakeId === 'all_tickets'){
    const stolen = tickets[loser]||0;
    await addTickets(loser, -stolen, `Perdió un desafío contra ${NAMES[winner]}`);
    await addTickets(winner, stolen, `Ganó un desafío contra ${NAMES[loser]} (+${stolen} tickets robados)`);
  } else if(stakeId === 'steal_heart'){
    hearts[loser] = Math.max((hearts[loser]??20) - 2, -1);
    hearts[winner] = Math.min((hearts[winner]??20) + 2, 20);
    pushHistory(`💔 ${NAMES[winner]} le robó 2 vidas a ${NAMES[loser]} en un desafío (${NAMES[winner]}: ${hearts[winner]}/20, ${NAMES[loser]}: ${hearts[loser]}/20)`);
    render();
    const ok1 = await saveProfile(winner); if(!ok1) queueRetry('profile:'+winner, ()=>saveProfile(winner));
    const ok2 = await saveProfile(loser); if(!ok2) queueRetry('profile:'+loser, ()=>saveProfile(loser));
  } else if(stakeId === 'capsules'){
    await addPendingPrize(winner, '5 Cápsulas Habilidad', src);
  } else if(stakeId === 'mints'){
    await addPendingPrize(winner, '5 Mentas de Naturaleza', src);
  } else if(stakeId === 'full_restores'){
    await addPendingPrize(winner, '2 Restaurar Todo', src);
  } else if(stakeId === 'steal_money'){
    await addPendingPrize(winner, 'Robar 100.000 monedas (manual en PKHeX: +100k a ti, -100k a él)', src);
  } else if(stakeId === 'steal_pokemon'){
    await addPendingPrize(winner, `Te quedas con ${stakeMonLabel || 'el Pokémon apostado'} de ${NAMES[loser]}`, src);
  } else if(stakeId === 'rename'){
    await addPendingPrize(winner, `Puedes ponerle el apodo que quieras a ${stakeMonLabel || 'el Pokémon apostado'} de ${NAMES[loser]}`, src);
  }
}
async function closeChallenge(){
  challengeState = null;
  render();
  const ok = await saveChallengeState();
  if(!ok) queueRetry('challenge', saveChallengeState);
}

function spinFinalWheel(role){
  const spinningFlag = role==='winner' ? finalWheelSpinningWinner : finalWheelSpinningLoser;
  const prizeAlreadySet = role==='winner' ? duelState.finalWinnerPrize : duelState.finalLoserPrize;
  if(spinningFlag || prizeAlreadySet) return;
  const prizes = role==='winner' ? WINNER_PRIZES : (duelState.bye ? LOSER_PRIZES : MERGED_LOSER_WHEEL);
  const wheelId = role==='winner' ? 'final-wheel-winner' : 'final-wheel-loser';

  if(role==='winner') finalWheelSpinningWinner = true; else finalWheelSpinningLoser = true;
  render();

  const idx = Math.floor(Math.random()*prizes.length);
  const segAngle = 360/prizes.length;
  const center = idx*segAngle + segAngle/2;
  const fullSpins = 5 + Math.floor(Math.random()*2);
  const target = fullSpins*360 + (360 - center);
  if(role==='winner'){ finalWheelRotationWinner += target; } else { finalWheelRotationLoser += target; }

  const wheelEl = document.getElementById(wheelId);
  if(wheelEl){
    wheelEl.style.transition = 'transform 4.2s cubic-bezier(0.15, 0.85, 0.25, 1)';
    void wheelEl.offsetWidth;
    wheelEl.style.transform = `rotate(${role==='winner'?finalWheelRotationWinner:finalWheelRotationLoser}deg)`;
  }
  playSound('spin');

  setTimeout(async ()=>{
    const prize = prizes[idx];
    const trainer = role==='winner' ? duelState.finalWinner : finalLoserOf();
    if(role==='winner'){
      finalWheelSpinningWinner = false;
      duelState.finalWinnerPrize = prize;
    } else {
      finalWheelSpinningLoser = false;
      duelState.finalLoserPrize = prize;
    }
    playSound('wheelLand');
    render();
    const ok = await saveDuelState();
    if(!ok) queueRetry('duel', saveDuelState);
    await applyPrizeToTrainer(trainer, prize, role==='winner' ? 'Ruleta del ganador de la final' : 'Ruleta del perdedor de la final');
    render();
  }, 4300);
}

async function finishDuel(){
  const { scheduled, bye, match1, match1Winner, match1LoserPrize, finalWinner, finalWinnerPrize, finalLoserPrize } = duelState;
  const finalLoser = finalLoserOf();
  duelHistory.unshift({
    id: crypto.randomUUID(),
    name: scheduled.name,
    date: scheduled.datetime,
    match1: { p1: match1.p1, p2: match1.p2, winner: match1Winner },
    final: bye ? { p1: match1Winner, p2: bye, winner: finalWinner } : null,
    champion: finalWinner,
    match1Score: eloScoreOf(duelState.match1Games, match1.p1, match1.p2),
    finalScore: bye ? eloScoreOf(duelState.finalGames, match1Winner, bye) : null,
    match1WinnerReward: '1 captura extra',
    match1LoserPrize,
    finalWinnerPrize,
    finalLoserPrize,
    finalLoser,
    ts: Date.now()
  });
  duelState = { scheduled:null, picks:[], bye:null, match1:null, match1Games:[], match1Winner:null, match1LoserPrize:null, finalGames:[], finalWinner:null, finalWinnerPrize:null, finalLoserPrize:null };
  duelWheelRotation = 0;
  finalWheelRotationWinner = 0;
  finalWheelRotationLoser = 0;
  finalWheelSpinningWinner = false;
  finalWheelSpinningLoser = false;
  match1LoserWheelRotation = 0;
  match1LoserWheelSpinning = false;
  render();
  const ok1 = await saveDuelHistory();
  if(!ok1) queueRetry('duelHistory', saveDuelHistory);
  const ok2 = await saveDuelState();
  if(!ok2) queueRetry('duel', saveDuelState);
}

function cryptArray(bytes, seed) {
  const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const n = bytes.length / 2;
  let s = seed >>> 0;
  for (let i = 0; i < n; i++) {
    s = (Math.imul(0x41c64e6d, s) + 0x6073) >>> 0;
    const xor = (s >>> 16) & 0xffff;
    const word = view.getUint16(i * 2, true);
    view.setUint16(i * 2, word ^ xor, true);
  }
  return bytes;
}

function shuffle67(blockData, sv) {
  if (sv === 0) return blockData;
  const blockSize = 56;
  const blocks = [0, 1, 2, 3].map((i) =>
    blockData.slice(i * blockSize, (i + 1) * blockSize)
  );
  const perm = [0, 1, 2, 3];
  const slotOf = [0, 1, 2, 3];
  const shuffle = BLOCK_POSITION.slice(sv * 4, sv * 4 + 4);
  for (let i = 0; i < 3; i++) {
    const desired = shuffle[i];
    const j = slotOf[desired];
    if (j === i) continue;
    [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
    const blockAtI = perm[i];
    perm[j] = blockAtI;
    slotOf[blockAtI] = j;
  }
  const out = new Uint8Array(blockData.length);
  blocks.forEach((b, i) => out.set(b, i * blockSize));
  return out;
}

function decryptPk6(rawSlot) {
  const data = new Uint8Array(rawSlot);
  const view = new DataView(data.buffer);
  const pv = view.getUint32(0, true); // Encryption Constant (EC), NO es el PID real
  const sv = (pv >>> 13) & 31;

  let shuffleRegion = data.slice(8, 8 + 224);
  shuffleRegion = cryptArray(shuffleRegion, pv);
  shuffleRegion = shuffle67(shuffleRegion, sv);
  data.set(shuffleRegion, 8);

  if (data.length > 232) {
    let party = data.slice(232);
    party = cryptArray(party, pv);
    data.set(party, 232);
  }
  return data;
}

function readNickname(dec) {
  // 26 bytes UTF-16LE a partir de offset 0x40 del bloque descifrado (13
  // unidades = 12 caracteres + terminador nulo). OJO: antes se leian solo
  // 24 bytes; con nombres largos (12 caracteres) se podia perder el ultimo.
  const view = new DataView(dec.buffer);
  let out = '';
  for (let i = 0x40; i < 0x40 + 26; i += 2) {
    const code = view.getUint16(i, true);
    if (code === 0) break;
    out += String.fromCharCode(code);
  }
  return out;
}

// FIX importante: la especie es la UNICA señal fiable de "vacio". Comprobar
// solo el PID/EC (offset 0) es un error, porque un Pokemon real inyectado con
// un editor puede tener EC=0 y seguir siendo perfectamente valido (confirmado
// con checksum en saves reales). Tampoco vale mirar si el bloque entero es
// cero: las cajas vacias de verdad SI tienen encryption constant en 0 y el
// resto de bytes con contenido "plantilla" (no ceros), asi que hay que
// descifrar siempre y decidir por la especie resultante.
function readPokemon(rawSlot, hasBattleStats) {
  const dec = decryptPk6(rawSlot);
  const view = new DataView(dec.buffer);
  const species = view.getUint16(8, true);
  if (species < 1 || species > 721) return null; // vacio real o trash bytes
  const level = hasBattleStats ? dec[0xec] : null;
  const exp = view.getUint32(0x10, true);
  const pid = view.getUint32(0x18, true);
  const heldItemId = view.getUint16(0x0a, true); // offset estandar PK6 (0x0A); igual que species+2, coherente con el resto del bloque A
  const abilityId = dec[0x14]; // CONFIRMADO por fuerza bruta contra save real (Julio 2026)
  const natureId = dec[0x1c]; // CONFIRMADO por fuerza bruta contra save real (Julio 2026)

  // --- NUEVO (sin verificar contra save real todavia, cotejar como se hizo
  // con nature/ability antes de fiarse del todo): genero/forma/EVs/IVs/moves.
  // Offsets segun estructura PK6 documentada (misma que usa PKHeX).
  const flagsByte = dec[0x1d]; // bit0 encuentro fortuito, bits1-2 genero, bits3-7 forma
  const fatefulEncounter = (flagsByte & 0x01) !== 0;
  const genderRaw = (flagsByte >> 1) & 0x03; // 0 = macho, 1 = hembra, 2 = sin genero
  const gender = genderRaw === 0 ? 'M' : genderRaw === 1 ? 'F' : null;
  const formId = (flagsByte >> 3) & 0x1f;

  // OJO orden real en el PK6: HP/Atk/Def/Spe/SpA/SpD (Speed va ANTES que
  // los especiales aqui, aunque en pantalla siempre se muestre al reves).
  const evs = {
    hp: dec[0x1e], atk: dec[0x1f], def: dec[0x20],
    spe: dec[0x21], spa: dec[0x22], spd: dec[0x23],
  };

  const moves = [
    view.getUint16(0x5a, true),
    view.getUint16(0x5c, true),
    view.getUint16(0x5e, true),
    view.getUint16(0x60, true),
  ];
  const movePP = [dec[0x62], dec[0x63], dec[0x64], dec[0x65]];

  // Mismo orden real que en EVs: HP/Atk/Def/Spe/SpA/SpD dentro del uint32.
  const iv32 = view.getUint32(0x76, true);
  const ivs = {
    hp:  iv32 & 0x1f,
    atk: (iv32 >>> 5) & 0x1f,
    def: (iv32 >>> 10) & 0x1f,
    spe: (iv32 >>> 15) & 0x1f,
    spa: (iv32 >>> 20) & 0x1f,
    spd: (iv32 >>> 25) & 0x1f,
    isEgg: !!((iv32 >>> 30) & 0x1),
    isNicknamed: !!((iv32 >>> 31) & 0x1),
  };
  // Amistad: el offset 0xEE que se probaba antes no era correcto (daba
  // siempre 0). El campo real es OriginalTrainerFriendship (0xCA) mientras
  // el Pokemon no haya cambiado de entrenador; si CurrentHandler (0x93) no
  // es 0 (se ha intercambiado), el valor vivo pasa a estar en
  // HandlingTrainerFriendship (0xA2) en su lugar -- offsets confirmados
  // contra el save real (Grubbin "Cuerno": CurrentHandler=0, amistad=69).
  const currentHandler = dec[0x93];
  const friendship = currentHandler === 0 ? dec[0xca] : dec[0xa2];

  // PS actual/max: solo existen en el bloque de combate que llevan los del
  // equipo (hasBattleStats), las cajas no los tienen -> confirmado contra
  // save real (offset 0xF0 = PS actual, 0xF2 = PS max).
  const hpCurrent = hasBattleStats ? view.getUint16(0xf0, true) : null;
  const hpMax = hasBattleStats ? view.getUint16(0xf2, true) : null;
  return {
    speciesId: species,
    speciesName: SPECIES_NAMES[species] || `#${species}`,
    nickname: readNickname(dec),
    level,
    exp,
    pid: '0x' + pid.toString(16),
    heldItemId,
    abilityId,
    natureId,
    gender,
    formId,
    fatefulEncounter,
    evs,
    ivs,
    moves,
    movePP,
    friendship,
    hpCurrent,
    hpMax,
  };
}

/**
 * @param {ArrayBuffer} buffer - contenido del archivo "main"
 */
function parseORASSave(buffer) {
  if (buffer.byteLength !== EXPECTED_SIZE) {
    throw new Error(
      `Tamaño de archivo inesperado: ${buffer.byteLength} (se esperaban ${EXPECTED_SIZE} bytes). ` +
      `Asegúrate de subir el archivo "main" de Pokémon Rubí Omega / Zafiro Alfa sin modificar.`
    );
  }
  const data = new Uint8Array(buffer);
  const view = new DataView(buffer);

  // Nombre de entrenador (UTF-16LE terminado en 0x0000)
  const nameBytes = data.slice(TRAINER_CARD_BASE + OT_NAME_OFFSET, TRAINER_CARD_BASE + OT_NAME_OFFSET + 24);
  let name = '';
  for (let i = 0; i < nameBytes.length; i += 2) {
    const code = nameBytes[i] | (nameBytes[i + 1] << 8);
    if (code === 0) break;
    name += String.fromCharCode(code);
  }

  const money = view.getUint32(MONEY_OFFSET, true);
  const badgeMask = data[BADGES_OFFSET];
  const badges = Array.from({ length: 8 }, (_, i) => (badgeMask & (1 << i)) !== 0);
  const badgeCount = badges.filter(Boolean).length;

  const party = [];
  for (let slot = 0; slot < PARTY_SLOTS; slot++) {
    const off = PARTY_BASE + slot * PARTY_SLOT_SIZE;
    const raw = data.slice(off, off + PARTY_SLOT_SIZE);
    const p = readPokemon(raw, true);
    if (p) party.push({ slot, ...p });
  }

  const boxes = [];
  for (let box = 0; box < BOXES; box++) {
    const mons = [];
    for (let slot = 0; slot < BOX_SLOTS; slot++) {
      const off = BOX_BASE + box * BOX_STRIDE + slot * BOX_SLOT_SIZE;
      const raw = data.slice(off, off + BOX_SLOT_SIZE);
      const p = readPokemon(raw, false);
      if (p) mons.push({ slot, ...p });
    }
    if (mons.length > 0) boxes.push({ box: box + 1, mons });
  }

  return { trainerName: name, money, badgeMask, badges, badgeCount, party, boxes };
}

/* ================================================================
   FORMATO POKEMON SHOWDOWN — resuelve nombres de habilidad/objeto/
   movimiento contra PokeAPI (cacheados) y monta el texto que se
   pega en el "Import" del team builder de Showdown.

   IMPORTANTE: los offsets de EVs/IVs/movimientos/genero son NUEVOS
   (no verificados contra un save real todavia, a diferencia de
   especie/habilidad/naturaleza que si se cotejaron a mano). Antes
   de fiaros del todo, comparad el resultado de un Pokemon conocido
   contra lo que dice PKHeX para ese mismo Pokemon, igual que se hizo
   con nature/ability.
   ================================================================ */
const __pokeApiNameCache = {}; // "ability:123" -> "Sturdy" (o promesa mientras carga)

async function fetchPokeApiName(kind, id) {
  if (!id) return null;
  const key = `${kind}:${id}`;
  if (__pokeApiNameCache[key]) return __pokeApiNameCache[key];
  const promise = fetch(`https://pokeapi.co/api/v2/${kind}/${id}`)
    .then(r => r.ok ? r.json() : null)
    .then(data => {
      if (!data) return null;
      const en = (data.names || []).find(n => n.language?.name === 'en');
      return en ? en.name : (data.name || null);
    })
    .catch(() => null);
  __pokeApiNameCache[key] = promise;
  const name = await promise;
  __pokeApiNameCache[key] = name; // sustituye la promesa por el valor resuelto
  return name;
}

function toShowdownGender(mon) {
  return mon.gender === 'M' ? ' (M)' : mon.gender === 'F' ? ' (F)' : '';
}

async function pokemonToShowdownText(mon, levelOverride) {
  const [abilityName, itemName, ...moveNames] = await Promise.all([
    fetchPokeApiName('ability', mon.abilityId),
    mon.heldItemId ? fetchPokeApiName('item', mon.heldItemId) : Promise.resolve(null),
    ...mon.moves.map(id => id ? fetchPokeApiName('move', id) : Promise.resolve(null)),
  ]);

  const nickname = mon.nickname && mon.nickname !== mon.speciesName ? mon.nickname : null;
  const header = nickname
    ? `${nickname} (${mon.speciesName})${toShowdownGender(mon)}`
    : `${mon.speciesName}${toShowdownGender(mon)}`;
  const itemLine = itemName ? ` @ ${itemName}` : '';

  const lines = [header + itemLine];
  if (abilityName) lines.push(`Ability: ${abilityName}`);
  // Showdown recalcula las estadisticas segun el nivel que le pongamos aqui;
  // no hace falta tocar nada mas (EVs/IVs/nature ya hacen su efecto solos).
  const effectiveLevel = levelOverride ?? mon.level;
  if (effectiveLevel && effectiveLevel !== 100) lines.push(`Level: ${effectiveLevel}`);
  if (mon.friendship != null) lines.push(`Happiness: ${mon.friendship}`);

  const evParts = ['hp', 'atk', 'def', 'spa', 'spd', 'spe']
    .filter(k => mon.evs[k] > 0)
    .map(k => `${mon.evs[k]} ${({hp:'HP',atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe'})[k]}`);
  if (evParts.length) lines.push(`EVs: ${evParts.join(' / ')}`);

  const natureName = NATURE_NAMES_EN[mon.natureId] ?? 'Hardy';
  lines.push(`${natureName} Nature`);

  const ivParts = ['hp', 'atk', 'def', 'spa', 'spd', 'spe']
    .filter(k => mon.ivs[k] < 31)
    .map(k => `${mon.ivs[k]} ${({hp:'HP',atk:'Atk',def:'Def',spa:'SpA',spd:'SpD',spe:'Spe'})[k]}`);
  if (ivParts.length) lines.push(`IVs: ${ivParts.join(' / ')}`);

  moveNames.filter(Boolean).forEach(m => lines.push(`- ${m}`));

  return lines.join('\n');
}

async function copyTeamAsShowdown(team, levelOverride) {

/* ---------------- PokeAPI helpers ---------------- */
async function fetchPokemonSprite(name){
  const slug = name.toLowerCase().trim().replace(/\s+/g,'-');
  const res = await fetch('https://pokeapi.co/api/v2/pokemon/'+slug);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  const sprite = (data.sprites.other && data.sprites.other['official-artwork'] && data.sprites.other['official-artwork'].front_default) || data.sprites.front_default;
  if(!sprite) throw new Error('no sprite');
  return { name: data.name, sprite };
}
async function fetchItemSprite(name){
  const slug = name.toLowerCase().trim().replace(/\s+/g,'-');
  const res = await fetch('https://pokeapi.co/api/v2/item/'+slug);
  if(!res.ok) throw new Error('not found');
  const data = await res.json();
  const sprite = data.sprites && data.sprites.default;
  if(!sprite) throw new Error('no sprite');
  return { name: data.name, sprite };
}

/* ---------------- Autocomplete ---------------- */
function attachAutocomplete(inputEl, dropdownEl, getList){
  inputEl.addEventListener('input', ()=>{
    const val = inputEl.value.trim().toLowerCase();
    if(val.length < 3){ dropdownEl.classList.remove('show'); dropdownEl.innerHTML=''; return; }
    const list = getList();
    const matches = list.filter(n=> n.startsWith(val)).slice(0, 8);
    if(matches.length === 0){ dropdownEl.classList.remove('show'); dropdownEl.innerHTML=''; return; }
    dropdownEl.innerHTML = matches.map(n=>`<div class="autocomplete-item">${n.replace(/-/g,' ')}</div>`).join('');
    dropdownEl.classList.add('show');
    [...dropdownEl.children].forEach((el,i)=>{
      el.onclick = ()=>{
        inputEl.value = matches[i];
        dropdownEl.classList.remove('show'); dropdownEl.innerHTML='';
        inputEl.focus();
      };
    });
  });
  inputEl.addEventListener('blur', ()=> setTimeout(()=>{ dropdownEl.classList.remove('show'); }, 150));
}

function openModal(html, closable){
  if(closable === undefined) closable = true;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  if(closable){
    overlay.addEventListener('click', (e)=>{ if(e.target === overlay) closeModal(); });
  }
  document.body.appendChild(overlay);
}
function closeModal(){
  const o = document.getElementById('modal-overlay');
  if(o) o.remove();
}

  const err = document.getElementById('offer-err');
  if(pendingItems.length === 0){ err.textContent = 'Añade al menos una cosa a la oferta.'; return; }

    tradesActive.unshift({ id: crypto.randomUUID(), trainer, items: pendingItems, ts: Date.now(), counters: [] });
    pushHistory(`🔁 ${NAMES[trainer]} publicó una oferta de trade`);
  } else {
    const offer = tradesActive.find(o=>o.id===offerId);
    if(offer){
      offer.counters.push({ id: crypto.randomUUID(), trainer, items: pendingItems, ts: Date.now() });
      pushHistory(`🔁 ${NAMES[trainer]} ofreció algo a cambio en un trade`);
    }
  }
  closeModal();
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function acceptTrade(offerId, counterId){
  const offer = tradesActive.find(o=>o.id===offerId);
  if(!offer) return;
  const counter = offer.counters.find(c=>c.id===counterId);
  if(!counter) return;
  if(!confirm(`¿Aceptar que ${NAMES[offer.trainer]} dé sus cosas a cambio de lo de ${NAMES[counter.trainer]}?`)) return;

  tradesHistory.unshift({
    id: crypto.randomUUID(),
    offerTrainer: offer.trainer, offerItems: offer.items,
    counterTrainer: counter.trainer, counterItems: counter.items,
    ts: Date.now()
  });
  tradesActive = tradesActive.filter(o=>o.id!==offerId);
  pushHistory(`🤝 Trade cerrado entre ${NAMES[offer.trainer]} y ${NAMES[counter.trainer]}`);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function cancelOffer(offerId){
  if(!confirm('¿Cancelar esta oferta?')) return;
  tradesActive = tradesActive.filter(o=>o.id!==offerId);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

async function deleteTradeRecord(id){
  if(!confirm('¿Eliminar este trade del historial? (Úsalo cuando ya esté pagado)')) return;
  tradesHistory = tradesHistory.filter(r=>r.id!==id);
  render();
  const ok = await saveTrades();
  if(!ok) queueRetry('trades', saveTrades);
}

/* ---------------- INIT + polling ---------------- */
(async function init(){
  const slider = document.getElementById('volume-slider');
  if(slider) slider.value = Math.round(soundVolume*100);
  const muteBtn = document.getElementById('mute-btn');
  if(muteBtn) muteBtn.textContent = soundMuted ? '🔇' : '🔊';
  loadNameLists();
  await loadAll();
  await seedDefaultNormasIfMissing();
  render();
  showNewsPopupIfAny();
  showTombPopupIfAny();
  setInterval(async ()=>{
    if(document.getElementById('modal-overlay') || duelSpinning || rouletteSpinning || slotSpinning || slotJackpotSpinning || loteriaDrawing || bjDealing || nineDealing || finalWheelSpinningWinner || finalWheelSpinningLoser || match1LoserWheelSpinning || sancionWheelSpinning || eggWheelSpinning || cemeteryAnimating || plinkoDropping || (crashState && crashState.phase === 'running') || (view==='final' && finalState && finalState.unlocked)) return; // don't refresh mid-edit, mid-spin, o mientras se está revelando LA FINAL
    const changed = await loadAll();
    if(changed) render(); // si no ha cambiado nada, nos ahorramos reconstruir toda la pantalla
  }, 6000);
})();

</script>
